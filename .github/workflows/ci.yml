name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jobCollectionWebApi/requirements.txt
      - run: pip install -r jobCollectionWebApi/requirements.txt
      - run: >-
          pytest -q
          tests/test_api_contracts.py
          tests/test_v2_api_contracts.py
          tests/test_agent_api_contract.py
          tests/test_production_safety.py
          tests/test_admin_deployment_config.py
          tests/test_release_architecture.py
          tests/test_test_layout.py
          tests/test_pytest_configuration.py
          tests/test_webapi_source_hygiene.py
      - run: cp .env.production.example .env.production
      - run: >-
          BACKEND_IMAGE=registry.example/job-api:ci
          FRONTEND_IMAGE=registry.example/job-frontend:ci
          docker compose config --quiet
