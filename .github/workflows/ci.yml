name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint:dead-code
      - run: npm run build

  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jobCollectionWebApi/requirements.txt
      - run: pip install -r jobCollectionWebApi/requirements.txt
      - run: >-
          pytest -q
          tests/test_api_contracts.py
          tests/test_v2_api_contracts.py
          tests/test_agent_api_contract.py
          tests/test_production_safety.py
          tests/test_admin_deployment_config.py
          tests/test_release_architecture.py
          tests/test_cicd_architecture.py
          tests/test_test_layout.py
          tests/test_pytest_configuration.py
          tests/test_webapi_source_hygiene.py
          tests/test_v2_message_api.py
          tests/test_llm_client.py
          tests/test_message_notification_migration.py
          tests/test_notification_service.py
          tests/test_notification_tasks.py
          tests/test_agent_markdown_stream.py
          tests/test_agent_events.py
          tests/test_agent_runtime.py
          tests/test_ai_task_billing.py
          tests/test_celery_notification_routing.py
          tests/test_resume_parser.py
          tests/test_v2_career_profile.py
      - run: cp .env.production.example .env.production
      - run: >-
          BACKEND_IMAGE=job-backend:ci
          FRONTEND_IMAGE=job-frontend:ci
          docker compose config --quiet

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t job-backend:ci -f jobCollectionWebApi/backend.Dockerfile .
      - run: >-
          docker run --rm --env-file .env.production.example
          job-backend:ci
          python -c "import jobCollectionWebApi.main; import jobCollectionWebApi.main_admin; import jobCollectionWebApi.worker"
      - run: docker build -t job-frontend:ci -f frontend/Dockerfile .
