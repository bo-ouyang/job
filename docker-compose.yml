name: job

services:
  db:
    image: postgres:15-alpine
    container_name: job_postgres
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-job}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - job_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: job_redis
    restart: always
    env_file:
      - .env.production
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    networks:
      - job_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  migration:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to an immutable release tag}
    command: alembic upgrade head
    env_file:
      - .env.production
    environment: &backend-environment
      POSTGRES_HOST: db
      REDIS_HOST: redis
      ES_ENABLED: "false"
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - job_net

  api:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to an immutable release tag}
    container_name: job_api
    restart: always
    command: uvicorn jobCollectionWebApi.main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes: &backend-volumes
      - ${JOB_STATIC_DIR:-/opt/job/static}:/app/static
      - ${JOB_CERTS_DIR:-/opt/job/certs}:/opt/job/certs:ro
    ports:
      - "127.0.0.1:18000:8000"
    env_file:
      - .env.production
    environment:
      <<: *backend-environment
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - job_net

  admin:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to an immutable release tag}
    container_name: job_admin
    restart: always
    command: uvicorn jobCollectionWebApi.main_admin:app --host 0.0.0.0 --port 8001
    volumes: *backend-volumes
    ports:
      - "127.0.0.1:18002:8001"
    env_file:
      - .env.production
    environment:
      <<: *backend-environment
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - job_net

  worker_realtime:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to an immutable release tag}
    container_name: job_worker_realtime
    restart: always
    command: celery -A jobCollectionWebApi.worker.celery_app worker -Q realtime --concurrency=4 --loglevel=info
    volumes: *backend-volumes
    env_file:
      - .env.production
    environment:
      <<: *backend-environment
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - job_net

  worker_batch:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to an immutable release tag}
    container_name: job_worker_batch
    restart: always
    profiles: ["batch"]
    command: celery -A jobCollectionWebApi.worker.celery_app worker -Q batch --concurrency=2 --loglevel=info
    volumes: *backend-volumes
    env_file:
      - .env.production
    environment:
      <<: *backend-environment
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - job_net

  beat:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to an immutable release tag}
    container_name: job_beat
    restart: always
    profiles: ["batch"]
    command: celery -A jobCollectionWebApi.worker.celery_app beat --loglevel=info
    volumes: *backend-volumes
    env_file:
      - .env.production
    environment:
      <<: *backend-environment
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      worker_realtime:
        condition: service_started
      worker_batch:
        condition: service_started
    networks:
      - job_net

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE to an immutable release tag}
    container_name: job_frontend
    restart: always
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ${JOB_STATIC_DIR:-/opt/job/static}:/usr/share/nginx/html/static:ro
    depends_on:
      - api
    networks:
      - job_net

volumes:
  postgres_data:
  redis_data:

networks:
  job_net:
    driver: bridge
