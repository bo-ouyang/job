services:
  db:
    image: postgres:15-alpine
    container_name: job_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-job}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - job_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: job_redis
    restart: always
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - job_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.0
    container_name: job_elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - job_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  migration:
    build:
      context: .
      dockerfile: jobCollectionWebApi/backend.Dockerfile
    command: alembic upgrade head
    env_file:
      - .env
    environment: &backend-environment
      POSTGRES_HOST: db
      REDIS_HOST: redis
      ES_HOST: elasticsearch
      ES_SCHEME: http
      ENVIRONMENT: production
      SCRAPY_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - job_net

  api:
    build:
      context: .
      dockerfile: jobCollectionWebApi/backend.Dockerfile
    container_name: job_api
    restart: always
    command: uvicorn jobCollectionWebApi.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./jobCollectionWebApi:/app/jobCollectionWebApi
      - ./common:/app/common
      - ./static:/app/static
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      <<: *backend-environment
    depends_on:
      migration:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    networks:
      - job_net

  admin:
    build:
      context: .
      dockerfile: jobCollectionWebApi/backend.Dockerfile
    container_name: job_admin
    restart: always
    command: uvicorn jobCollectionWebApi.main_admin:app --host 0.0.0.0 --port 8001
    volumes:
      - ./jobCollectionWebApi:/app/jobCollectionWebApi
      - ./common:/app/common
      - ./static:/app/static
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      <<: *backend-environment
    depends_on:
      migration:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    networks:
      - job_net

  worker_realtime:
    build:
      context: .
      dockerfile: jobCollectionWebApi/backend.Dockerfile
    container_name: job_worker_realtime
    restart: always
    command: celery -A jobCollectionWebApi.worker.celery_app worker -Q realtime --concurrency=2 --loglevel=info
    volumes:
      - ./jobCollectionWebApi:/app/jobCollectionWebApi
      - ./common:/app/common
    env_file:
      - .env
    environment:
      <<: *backend-environment
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - job_net

  worker_batch:
    build:
      context: .
      dockerfile: jobCollectionWebApi/backend.Dockerfile
    container_name: job_worker_batch
    restart: always
    command: celery -A jobCollectionWebApi.worker.celery_app worker -Q batch --concurrency=2 --loglevel=info
    volumes:
      - ./jobCollectionWebApi:/app/jobCollectionWebApi
      - ./common:/app/common
    env_file:
      - .env
    environment:
      <<: *backend-environment
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - job_net

  beat:
    build:
      context: .
      dockerfile: jobCollectionWebApi/backend.Dockerfile
    container_name: job_beat
    restart: always
    command: celery -A jobCollectionWebApi.worker.celery_app beat --loglevel=info
    volumes:
      - ./jobCollectionWebApi:/app/jobCollectionWebApi
      - ./common:/app/common
    env_file:
      - .env
    environment:
      <<: *backend-environment
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      worker_realtime:
        condition: service_started
      worker_batch:
        condition: service_started
    networks:
      - job_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: job_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - job_net

  # ── Monitoring ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: job_prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    networks:
      - job_net

  grafana:
    image: grafana/grafana:latest
    container_name: job_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - job_net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  job_net:
    driver: bridge
